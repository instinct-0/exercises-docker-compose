services:
    frontend:
        image: pdrbrbs/frontend
        ports:
            - 5001:5001

    backend:
        image: pdrbrbs/backend
        environment:
            GIN_MODE:           "release"
            REDIS_HOST:         "redis"
            POSTGRES_HOST:      "database"
            POSTGRES_PASSWORD:  "trust"

        ports:
            - 8080:8080

    redis:
        image: redis:8

    database:
        image: postgres:18
        environment:
            POSTGRES_PASSWORD:  "trust"
           
        
