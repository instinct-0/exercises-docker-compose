services:
    frontend:
        image: pdrbrbs/frontend
        environment:
            REACT_APP_BACKEND_URL:  "http://localhost:8000"
            
        ports:
            - 5001:5001

    backend:
        image: pdrbrbs/backend
        environment:
            GIN_MODE:           "release"
            REDIS_HOST:         "redis"
            POSTGRES_HOST:      "database"
            POSTGRES_PASSWORD:  "trust"
            REQUEST_ORIGIN:     "http://localhost:8000"

        ports:
            - 8080:8080

    redis:
        image: redis:8

    database:
        image: postgres:18
        environment:
            POSTGRES_HOST:      "database"
            POSTGRES_PASSWORD:  "trust"
        volumes:
            - ./database:/var/lib/postgresql
            
    nginx:
        image: nginx
        ports:
            - 8000:80
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
