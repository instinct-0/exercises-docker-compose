services:
    frontend:
        image: pdrbrbs/frontend

    backend:
        image: pdrbrbs/backend
        environment:
            GIN_MODE:           "release"
            REDIS_HOST:         "redis"
            POSTGRES_HOST:      "db"
            POSTGRES_PASSWORD:  "trust"
            REQUEST_ORIGIN:     "http://localhost:8000"

    redis:
        image: redis:8

    db:
        image: postgres:18
        environment:
            POSTGRES_HOST:      "db"
            POSTGRES_PASSWORD:  "trust"
        volumes:
            - ./database:/var/lib/postgresql
            
    nginx:
        image: nginx
        ports:
            - 8000:80
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
